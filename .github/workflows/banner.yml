name: banner

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: PYTHONPATH=scripts/princess python3 -m unittest discover -s scripts/princess/tests -v
      - name: The SVGs in assets/ match the code
        run: |
          python3 scripts/princess
          git diff --exit-code assets/ || (echo "Run python3 scripts/princess and commit assets/." && exit 1)
